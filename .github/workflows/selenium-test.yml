name: Selenium HRM Login Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel in-progress runs when a new workflow is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      total: ${{ steps.parse-results.outputs.total }}
      passed: ${{ steps.parse-results.outputs.passed }}
      failed: ${{ steps.parse-results.outputs.failed }}
      skipped: ${{ steps.parse-results.outputs.skipped }}
      status: ${{ job.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Chrome and ChromeDriver
        uses: browser-actions/setup-chrome@latest

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Login Test
        working-directory: selenium_hrm
        run: mvn test -Dtest=LoginTest -Dsurefire.useFile=false

      - name: Parse Test Results
        id: parse-results
        working-directory: selenium_hrm
        run: |
          echo "Parsing test results..."
          
          # Parse JUnit XML results
          TOTAL=$(grep -c "testcase" target/surefire-reports/*.xml 2>/dev/null || echo "0")
          FAILED=$(grep -c "failure" target/surefire-reports/*.xml 2>/dev/null || echo "0")
          SKIPPED=$(grep -c "skipped" target/surefire-reports/*.xml 2>/dev/null || echo "0")
          PASSED=$((TOTAL - FAILED - SKIPPED))
          
          # Ensure non-negative values
          [ "$PASSED" -lt 0 ] && PASSED=0
          [ "$FAILED" -lt 0 ] && FAILED=0
          
          echo "Total: $TOTAL, Passed: $PASSED, Failed: $FAILED, Skipped: $SKIPPED"
          
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: selenium_hrm/target/surefire-reports/
          retention-days: 7

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_number }}
          path: selenium_hrm/target/allure-results/
          retention-days: 7

  # Job gửi email - chạy sau job test
  email-notification:
    needs: test
    runs-on: ubuntu-latest
    if: always() # Luôn gửi email dù pass hay fail

    steps:
      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.EMAIL_FROM }}
          to: ${{ secrets.EMAIL_TO }}
          subject: |
            ${{ needs.test.outputs.status == 'success' && '✅' || '❌' }} 
            HRM Test Results - ${{ github.ref_name }} - ${{ needs.test.outputs.passed }}/${{ needs.test.outputs.total }} Passed
          html_body: |
            <!DOCTYPE html>
            <html>
            <head>
              <style>
                body { font-family: Arial, sans-serif; margin: 20px; }
                .header { background: ${{ needs.test.outputs.status == 'success' && '#28a745' || '#dc3545' }}; color: white; padding: 20px; border-radius: 8px; }
                .summary { margin: 20px 0; }
                .stat { display: inline-block; margin: 10px 20px; padding: 15px 25px; background: #f8f9fa; border-radius: 8px; text-align: center; }
                .stat-value { font-size: 32px; font-weight: bold; }
                .stat-label { font-size: 14px; color: #666; }
                .passed { color: #28a745; }
                .failed { color: #dc3545; }
                .skipped { color: #ffc107; }
                .link-btn { display: inline-block; padding: 12px 24px; background: #007bff; color: white; text-decoration: none; border-radius: 6px; margin: 10px 5px; }
                .footer { margin-top: 20px; font-size: 12px; color: #666; }
              </style>
            </head>
            <body>
              <div class="header">
                <h1>🎯 HRM Test Results</h1>
                <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
                <p><strong>Commit:</strong> ${{ github.sha }}</p>
                <p><strong>Triggered by:</strong> ${{ github.actor }}</p>
                <p><strong>Status:</strong> ${{ needs.test.outputs.status == 'success' && '✅ PASSED' || '❌ FAILED' }}</p>
              </div>
              
              <div class="summary">
                <h2>📊 Test Summary</h2>
                <div class="stat">
                  <div class="stat-value">${{ needs.test.outputs.total }}</div>
                  <div class="stat-label">Total</div>
                </div>
                <div class="stat">
                  <div class="stat-value passed">${{ needs.test.outputs.passed }}</div>
                  <div class="stat-label">Passed</div>
                </div>
                <div class="stat">
                  <div class="stat-value failed">${{ needs.test.outputs.failed }}</div>
                  <div class="stat-label">Failed</div>
                </div>
                <div class="stat">
                  <div class="stat-value skipped">${{ needs.test.outputs.skipped }}</div>
                  <div class="stat-label">Skipped</div>
                </div>
              </div>
              
              <div class="links">
                <h2>🔗 Links</h2>
                <a class="link-btn" href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow Run</a>
                <a class="link-btn" href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts">Download Allure Results</a>
              </div>
              
              <div class="footer">
                <p>This is an automated email from HRM Testing Framework CI/CD.</p>
                <p>Repository: ${{ github.repository }}</p>
              </div>
            </body>
            </html>
          convert_markdown: false
          priority: ${{ needs.test.outputs.status == 'failure' && 'high' || 'normal' }}
