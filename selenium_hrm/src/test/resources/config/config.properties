# ==================== ENVIRONMENT ====================
# Default environment: local, qa, staging
# Run with -Denv=qa or -Denv=staging to use different config
environment=local

# ==================== BASE CONFIG ====================
URL=https://hrm.anhtester.com/

# ==================== TIMEOUT CONFIG ====================
DEFAULT_TIMEOUT=10
PAGE_LOAD_TIMEOUT=20
POLLING_INTERVAL=500
IMPLICIT_WAIT=0
EXPLICIT_WAIT=10

# ==================== SCREENSHOT CONFIG ====================
SCREENSHOT_PATH=target/screenshots
TAKE_SCREENSHOT_ON_FAILURE=true

# ==================== REPORT CONFIG ====================
EXTENT_REPORT_PATH=target/extent-reports
ALLURE_RESULTS_PATH=target/allure-results

# ==================== BROWSER CONFIG ====================
BROWSER=chrome
HEADLESS=false
MAXIMIZE_WINDOW=true
PAGE_LOAD_STRATEGY=normal
