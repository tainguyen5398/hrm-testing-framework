# ==================== ENVIRONMENT ====================
environment=qa

# ==================== BASE CONFIG ====================
URL=https://qa.hrm.anhtester.com/

# ==================== TIMEOUT CONFIG ====================
DEFAULT_TIMEOUT=10
PAGE_LOAD_TIMEOUT=20
POLLING_INTERVAL=500
IMPLICIT_WAIT=0
EXPLICIT_WAIT=10

# ==================== SCREENSHOT CONFIG ====================
SCREENSHOT_PATH=target/screenshots
TAKE_SCREENSHOT_ON_FAILURE=true

# ==================== REPORT CONFIG ====================
EXTENT_REPORT_PATH=target/extent-reports
ALLURE_RESULTS_PATH=target/allure-results

# ==================== LOGIN TEST DATA ====================
LOGIN_VALID_USERNAME=admin_example
LOGIN_VALID_PASSWORD=123456
LOGIN_INVALID_USERNAME=Admin
LOGIN_INVALID_PASSWORD=wrongpassword
LOGIN_SUCCESS_URL_PART=/erp/desk

# ==================== BROWSER CONFIG ====================
BROWSER=chrome
HEADLESS=false
MAXIMIZE_WINDOW=true
PAGE_LOAD_STRATEGY=normal
